# =============================================================================
# CVAPI Production - Railway PostgreSQL + Local Redis
# =============================================================================
# Apply after docker-compose.yml or docker-compose.local.yml.
# Requires Docker Compose 2.24.4+ because !override removes the inherited
# dependency on the local PostgreSQL healthcheck.
# Keep all real credentials in .env; never commit them.
# =============================================================================

services:
  sub2api:
    image: ghcr.io/laoji2333/sub2api:${SUB2API_IMAGE_TAG:?SUB2API_IMAGE_TAG must be an immutable sha-* tag}
    environment:
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST is required for Railway PostgreSQL}
      DATABASE_PORT: ${DATABASE_PORT:?DATABASE_PORT is required for Railway PostgreSQL}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required for Railway PostgreSQL}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required for Railway PostgreSQL}
      DATABASE_DBNAME: ${DATABASE_DBNAME:?DATABASE_DBNAME is required for Railway PostgreSQL}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-require}
    depends_on: !override
      redis:
        condition: service_healthy

  # Preserve the old local PostgreSQL definition and data for an explicit
  # rollback/recovery operation, but do not start it in production by default.
  postgres:
    profiles:
      - local-postgres
